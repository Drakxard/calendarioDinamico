<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendario Semanal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="nav-group">
          <button class="nav-button" id="previous-week" aria-label="Semana anterior">
            &lt;
          </button>
          <button class="nav-button" id="next-week" aria-label="Semana siguiente">
            &gt;
          </button>
        </div>
        <div class="title-group">
          <p class="title-eyebrow">Google Calendar OAuth</p>
          <h1 id="range-title">Semana</h1>
        </div>
        <div class="auth-group" id="auth-group">
          <a class="auth-button auth-button--primary" id="connect-google" href="/auth/google">
            Conectar Google Calendar
          </a>
          <button
            class="auth-button auth-button--danger"
            id="clear-template"
            type="button"
            hidden
          >
            Borrar subida
          </button>
          <button class="auth-button auth-button--ghost" id="logout-button" type="button" hidden>
            Desconectar
          </button>
        </div>
      </header>

      <section class="status-banner" id="status-banner" hidden></section>

      <main class="calendar-card">
        <section class="calendar-header">
          <div class="timezone-label" id="timezone-label">GMT-03</div>
          <div class="header-days" id="header-days"></div>
        </section>

        <section class="all-day-band" id="all-day-band">
          <div class="all-day-spacer"></div>
          <div class="all-day-grid" id="all-day-grid"></div>
        </section>

        <section class="calendar-grid" id="calendar-grid">
          <div class="loading-state">Verificando autenticacion...</div>
        </section>

        <section class="summary-board" id="summary-board" hidden>
          <div class="summary-head">
            <div>
              <p class="summary-eyebrow">Resumen diario</p>
              <h2>Carga por materia</h2>
            </div>
            <button class="auth-button auth-button--ghost" id="copy-json" type="button" hidden>
              Copiar JSON
            </button>
          </div>
          <div class="summary-grid" id="summary-grid"></div>
        </section>
      </main>
    </div>

    <div class="preview-modal" id="preview-modal" hidden>
      <div class="preview-dialog" role="dialog" aria-modal="true" aria-labelledby="preview-title">
        <div class="preview-heading">
          <div>
            <p class="summary-eyebrow">Vista previa</p>
            <h2 id="preview-title">Semana importada desde JSON</h2>
            <p class="preview-note">
              Pega otro JSON con Ctrl+V para reemplazar esta vista previa.
            </p>
          </div>
          <button
            class="nav-button preview-close"
            id="preview-close"
            type="button"
            aria-label="Cerrar vista previa"
          >
            &times;
          </button>
        </div>

        <section class="status-banner preview-banner" id="preview-message" hidden></section>

        <div class="calendar-card preview-card">
          <section class="calendar-header">
            <div class="timezone-label" id="preview-timezone-label">GMT-03</div>
            <div class="header-days" id="preview-header-days"></div>
          </section>

          <section class="calendar-grid" id="preview-calendar-grid"></section>

          <section class="summary-board" id="preview-summary-board">
            <div class="summary-head">
              <div>
                <p class="summary-eyebrow">Resumen diario</p>
                <h2>Horas por materia</h2>
              </div>
            </div>
            <div class="summary-grid" id="preview-summary-grid"></div>
          </section>
        </div>

        <div class="preview-actions">
          <button class="auth-button auth-button--ghost" id="preview-cancel" type="button">
            Cancelar
          </button>
          <button class="auth-button auth-button--primary" id="preview-confirm" type="button">
            Confirmar
          </button>
        </div>
      </div>
    </div>

    <template id="hour-label-template">
      <div class="hour-label"></div>
    </template>

    <template id="grid-column-template">
      <div class="day-column">
        <div class="day-background"></div>
        <div class="events-layer"></div>
      </div>
    </template>

    <script src="/app.js" defer></script>
  </body>
</html>
